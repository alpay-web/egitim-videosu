name: Dil kursu - Chatterbox referans denemesi
on:
  push:
    branches: [dil-kursu-pilot]
    paths: ["dil_kursu/ses_deneme/tetik_chatterbox.txt"]
permissions:
  contents: write
jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: [fettah, kadin]
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Kurulum
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          pip install -q -r requirements.txt
          pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@ab55923c27757c90cfcc407baa57dc25a7d25217" piper-tts==1.8.0 faster-whisper==1.2.1
      - name: Üret
        run: |
          set -o pipefail
          case "${{ matrix.ref }}" in
            fahrettin) REF="" ;;
            fettah) REF="--referans dil_kursu/ses_deneme/ref_fettah.wav" ;;
            kadin) REF="--referans dil_kursu/ses_deneme/ref_kadin_ahenk.wav" ;;
          esac
          echo "referans: $REF"
          python scripts/video_uret.py dil_kursu/ses_deneme/senaryo.json --sadece-ses cikti/chatterbox_${{ matrix.ref }} \
            --ses chatterbox --kalite 3 $REF --abarti 0.5 --cfg 0.5 --hiz 1.0 2>&1 | grep -v -E "it/s\]|s/it\]" | tail -30
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "ses-chatterbox_${{ matrix.ref }}", path: cikti/}
  yayinla:
    needs: chatterbox
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: hepsi}
      - name: Yayınla
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cd hepsi && zip -q -r ../chatterbox_deneme.zip . && cd ..
          gh release delete ses-deneme-chatterbox --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ses-deneme-chatterbox chatterbox_deneme.zip --prerelease -R "$GITHUB_REPOSITORY" \
            --title "Dil kursu: Chatterbox referans denemesi" --notes "dil-kursu-pilot dalından" --target dil-kursu-pilot
