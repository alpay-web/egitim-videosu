name: Seslendirme üret
# Claude ortamı Hugging Face'e erişemediği için ağır ses modelleri GitHub Actions'ta çalışır.
# Sahne grupları paralel işlenir. Çıktı: cümle başına ses dosyaları (SS_CC.wav) -> release içinde zip.
on:
  workflow_dispatch:
    inputs:
      senaryo:
        description: "Senaryo JSON yolu"
        default: "ornek/senaryo_b1.json"
      motor:
        description: "chatterbox | piper | freya"
        default: "chatterbox"
      parcalar:
        description: 'Paralel sahne grupları (JSON liste), ör. ["1-3","4-6","7-9","10-12"]'
        default: '["1-3","4-6","7-9","10-12"]'
      ekstra:
        description: "ek argümanlar"
        default: "--abarti 0.5 --cfg 0.5 --hiz 1.0"
      etiket:
        description: "sonucun yükleneceği release etiketi"
        default: "ses-son"
      kalite:
        description: "Whisper kalite kapısı: cümle başına en fazla deneme (0 = kapalı)"
        default: "3"
      ham_sakla:
        description: "Temizlik öncesi ham sesleri de sakla (sesler/ham/, karşılaştırma için)"
        default: "false"
      taban:
        description: "Önceki ses release etiketleri (virgülle). Aynı metnin sesi varsa yeniden üretilmez."
        default: ""
permissions:
  contents: write
jobs:
  ses:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        sahne: ${{ fromJSON(inputs.parcalar) }}
    steps:
      - name: Disk alanı aç (model ~3 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true; df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Kurulum
        run: |
          sudo apt-get -qq install -y ffmpeg > /dev/null
          pip install -q -r requirements.txt
          if [ "${{ inputs.motor }}" = "chatterbox" ]; then pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@ab55923c27757c90cfcc407baa57dc25a7d25217" piper-tts==1.8.0; fi
          if [ "${{ inputs.kalite }}" != "0" ]; then pip install -q faster-whisper==1.2.1; fi
      - name: Önbellek (önceki sesler)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TABAN=""
          for e in $(echo "${{ inputs.taban }}" | tr ',' ' '); do
            mkdir -p "taban/$e" && gh release download "$e" -p 'sesler*.zip*' -D "taban/$e" -R "${{ github.repository }}" || continue
            (cd "taban/$e" && cat sesler*.zip* > hepsi.zip 2>/dev/null; unzip -oq hepsi.zip || unzip -oq sesler.zip) || true
            TABAN="$TABAN,taban/$e"
          done
          echo "TABAN=${TABAN#,}" >> "$GITHUB_ENV"
      - name: Seslendir
        run: |
          set -o pipefail
          python scripts/video_uret.py "${{ inputs.senaryo }}" --sadece-ses sesler --ses "${{ inputs.motor }}" \
            --sahne "${{ matrix.sahne }}" --kalite "${{ inputs.kalite }}" ${TABAN:+--taban-ses "$TABAN"} ${{ inputs.ekstra }} 2>&1 | grep -v -E "it/s\]|s/it\]" | tee "log_${{ matrix.sahne }}.txt"
          cp "log_${{ matrix.sahne }}.txt" sesler/
          mv sesler/kalite_raporu.txt "sesler/kalite_${{ matrix.sahne }}.txt" 2>/dev/null || true
          mv sesler/dizin.json "sesler/dizin_${{ matrix.sahne }}.json" 2>/dev/null || true
          cp ~/.egitim_video/sesler/referans_fahrettin.wav sesler/_referans.wav 2>/dev/null || true
      - name: Gürültü temizliği (DeepFilterNet3)
        run: |
          set -eo pipefail
          python -m venv /tmp/df
          /tmp/df/bin/pip install -q torch==2.1.2 torchaudio==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          /tmp/df/bin/pip install -q deepfilternet==0.5.6 soundfile "numpy<2"
          if [ "${{ inputs.ham_sakla }}" = "true" ]; then mkdir -p sesler/ham && cp sesler/[0-9]*.wav sesler/ham/ 2>/dev/null || true; fi
          /tmp/df/bin/python scripts/ses_temizle.py sesler --sinir 30
          mv sesler/temizlendi.txt "sesler/temizlendi_${{ matrix.sahne }}.txt" 2>/dev/null || true
      - name: Ses kalitesi puanı (DNSMOS)
        run: |
          pip install -q onnxruntime librosa soundfile
          python scripts/ses_puan.py sesler || echo "DNSMOS puanlanamadı"
          mv sesler/ses_puan.json "sesler/ses_puan_${{ matrix.sahne }}.json" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: sesler-${{ matrix.sahne }}
          path: sesler/
  yayinla:
    needs: ses
    if: ${{ !cancelled() }}   # bir parça çökse bile başarılı parçaların sesleri yayınlansın (önbelleğe girer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parcalar
          merge-multiple: true
      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get -qq install -y ffmpeg > /dev/null
          mkdir -p sesler && mv parcalar/[0-9]*.wav sesler/ && (mv parcalar/_referans.wav sesler/ 2>/dev/null || true) && cat parcalar/log_*.txt > seslendirme.log || true
          python3 -c "import json,glob,os,shutil; d={}
          [d.update(json.load(open(f))) for f in glob.glob('parcalar/**/dizin*.json', recursive=True)]
          json.dump(d, open('sesler/dizin.json','w'), ensure_ascii=False)
          [shutil.move(f, 'sesler/') for f in glob.glob('parcalar/[0-9]*.json')]
          open('sesler/temizlendi.txt','w').write(''.join(open(f).read() for f in glob.glob('parcalar/temizlendi_*.txt')))"
          pip install -q numpy
          python3 scripts/ses_puan.py sesler --birlestir parcalar/ses_puan_*.json || true
          cp sesler/ses_puan.json ses_puan.json 2>/dev/null || echo '{}' > ses_puan.json
          cat parcalar/kalite_*.txt > kalite_raporu.txt 2>/dev/null || true
          [ -s kalite_raporu.txt ] || echo "(kalite kapısı kapalı ya da tüm cümleler önbellekten geldi)" > kalite_raporu.txt
          [ -s seslendirme.log ] || echo "(log yok)" > seslendirme.log
          ls sesler/[0-9]*.wav | sort | sed "s/^/file '/; s/$/'/" > liste.txt
          ffmpeg -v error -f concat -safe 0 -i liste.txt -b:a 160k onizleme.mp3
          cd sesler && zip -q -r ../sesler.zip . && cd ..
          gh release delete "${{ inputs.etiket }}" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "${{ inputs.etiket }}" sesler.zip onizleme.mp3 seslendirme.log kalite_raporu.txt ses_puan.json --prerelease \
            --repo "$GITHUB_REPOSITORY" --title "Seslendirme: ${{ inputs.etiket }}" \
            --notes "motor=${{ inputs.motor }} senaryo=${{ inputs.senaryo }} ${{ inputs.ekstra }}"
