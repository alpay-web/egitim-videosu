name: Modelleri GitHub'a kopyala
# Claude ortamı Hugging Face'e erişemez; gereken model dosyaları bu repodaki release'lere kopyalanır.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chatterbox:
    runs-on: ubuntu-latest
    steps:
      - name: Chatterbox Multilingual (MIT) dosyalarını kopyala
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir m && cd m
          B=https://huggingface.co/ResembleAI/chatterbox/resolve/main
          for f in ve.pt t3_mtl23ls_v2.safetensors s3gen.pt grapheme_mtl_merged_expanded_v1.json conds.pt Cangjie5_TC.json; do
            curl -fsSL -o "$f" "$B/$f"
          done
          # GitHub release dosya sınırı 2 GB: büyük dosyaları parçala
          for f in *; do
            if [ $(stat -c%s "$f") -gt 1900000000 ]; then split -b 1800M -d "$f" "$f.parca"; rm "$f"; fi
          done
          ls -la
          gh release delete modeller-chatterbox --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create modeller-chatterbox * --repo "$GITHUB_REPOSITORY" --title "Chatterbox Multilingual modeli" \
            --notes "ResembleAI/chatterbox (MIT lisansı) dosyalarının kopyası. Claude ortamı Hugging Face'e erişemediği için burada barındırılıyor."
