name: Sürüm yayınla
# VERSION dosyasındaki sürümü etiketler ve CHANGELOG'daki bölümüyle GitHub sürümü oluşturur.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  surum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Etiketle ve yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          awk -v v="## $V" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notlar.md
          gh release create "v$V" --target "${{ github.sha }}" --title "egitim-videosu $V" --notes-file notlar.md --latest
